<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tourencol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Video de fondo */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Oscurecer video */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    /* Contenido */
    .container {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .link-btn {
      width: 260px;
      padding: 14px;
      margin: 10px 0;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .link-btn:hover {
      transform: scale(1.03);
      background: #f0f0f0;
    }
  </style>
</head>

<body>

  <!-- Video de fondo -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <!-- Capa oscura -->
  <div class="overlay"></div>

  <!-- Contenido -->
  <div class="container">
    <h1>Tourencol</h1>

    <a class="link-btn" href="https://api.whatsapp.com/message/NWTKUGQ4OCITF1?autoload=1&app_absent=0" target="_blank">
      WhatsApp
    </a>

    <a class="link-btn" href="https://www.facebook.com/tourencol/?locale=es_LA" target="_blank">
      Facebook
    </a>

    <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">
      Instagram
    </a>

    <a class="link-btn" href="https://www.tiktok.com/@tourencol?_r=1&_t=ZS-93SFjsYbSq7" target="_blank">
      TikTok
    </a>

    <a class="link-btn" href="#" target="_blank">
      Portafolio
    </a>
  </div>

</body>
</html>
