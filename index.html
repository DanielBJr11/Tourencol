<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos | Tourencol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Fondo */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.5)
      );
      z-index: -2;
    }

    /* Contenedor principal */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 🔥 clave */
      padding-top: 60px;           /* 🔥 subir todo */
      position: relative;
    }

    /* Logo */
    .logo img {
      width: 155px;
      margin-bottom: 8px;
    }

    /* Título */
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
      text-align: center;
    }

    /* Botones */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 5px;
      z-index: 4;
    }

    .link-btn {
      width: 245px; /* 🔥 más corto */
      padding: 14px;
      border-radius: 40px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: #1f2a1f;
      background: rgba(198, 215, 185, 0.8);
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(198, 215, 185, 0.95);
    }

    /* Capibara */
    .capibara {
      position: absolute;
      bottom: -20px; /* 🔥 más abajo */
      right: -30px;
      z-index: 1;    /* 🔥 detrás */
      opacity: 0.9;
    }

    .capibara img {
      width: 200px;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      z-index: 3;
    }

    /* Desktop */
    @media (min-width: 768px) {

      .logo img {
        width: 200px;
      }

      h1 {
        font-size: 36px;
      }

      .link-btn {
        width: 320px;
        font-size: 18px;
      }

      .capibara img {
        width: 380px;
      }
    }
  </style>
</head>

<body>

  <!-- Video fondo -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="img/video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="page">

    <div class="logo">
      <img src="img/logo.png" alt="Logo Tourencol">
    </div>

    <h1>CONTÁCTANOS</h1>

    <div class="links">
      <a class="link-btn" href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">WhatsApp</a>
      <a class="link-btn" href="https://www.facebook.com/Tourencol" target="_blank">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">Instagram</a>
      <a class="link-btn" href="https://www.tiktok.com/@tourencol" target="_blank">TikTok</a>
      <a class="link-btn" href="#" onclick="return false;">Portafolio</a>
    </div>

    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara decorativo">
    </div>

    <div class="footer">
      <strong>TOURENCOL</strong><br>
      EMAIL<br>
      reservas@tourencol.com.co
    </div>

  </div>

</body>
</html>
