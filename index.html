<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourencol | Contáctanos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #000;
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

/* Video de fondo */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* Capa oscura */
.overlay {
  min-height: 100vh;
  background: rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 35px 20px 160px;
  text-align: center;
}

/* Logo */
.logo {
  width: 120px;
  margin-bottom: 10px;
}

/* Título */
h1 {
  margin: 15px 0 22px;
  letter-spacing: 2px;
  font-size: 28px;
}

/* Botones */
.botones {
  width: 100%;
  max-width: 320px; /* 🔥 menos ancho */
}

.botones a {
  display: block;
  background: rgba(198, 211, 175, 0.75); /* 🔥 más translúcido */
  color: #1f2d16;
  text-decoration: none;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 40px;
  font-weight: bold;
  transition: background 0.2s ease, transform 0.2s ease;
}

.botones a:hover {
  background: rgba(198, 211, 175, 0.9);
  transform: scale(1.03);
}

/* Footer alineado a la izquierda */
.footer {
  position: absolute;
  bottom: 45px;
  left: 20px;
  text-align: left;
  font-size: 14px;
  line-height: 1.5;
  opacity: 0.95;
}

/* Capibara */
.capibara {
  position: absolute;
  bottom: 0;        /* 🔥 patica en el piso */
  right: 0;
  width: 175px;     /* 🔥 un poco más grande */
  opacity: 0.88;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- Video de fondo -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="img/video.mp4" type="video/mp4">
</video>

<div class="overlay">

  <img src="img/logo.png" class="logo" alt="Tourencol">

  <h1>CONTÁCTANOS</h1>

  <div class="botones">
    <a href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">WhatsApp</a>
    <a href="https://www.facebook.com/Tourencol" target="_blank">Facebook</a>
    <a href="https://www.instagram.com/tourencol/" target="_blank">Instagram</a>
    <a href="https://www.tiktok.com/@tourencol" target="_blank">TikTok</a>
    <a href="#" onclick="return false;">Portafolio</a>
  </div>

</div>

<div class="footer">
  <strong>TOURENCOL</strong><br>
  EMAIL<br>
  reservas@tourencol.com.co
</div>

<img src="img/capibara.png" class="capibara" alt="Capibara">

</body>
</html>
