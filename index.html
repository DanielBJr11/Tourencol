<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    /* Fondo */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: -1;
    }

    /* Contenedor */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Logo */
    .logo img {
      width: 150px;
      margin-bottom: 10px;
    }

    /* Título */
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
      text-align: center;
    }

    /* Botones */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 2;
    }

    .link-btn {
      width: 280px;
      padding: 16px;
      border-radius: 40px;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      color: #1b1b1b;
      background: rgba(180, 205, 160, 0.85);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .link-btn:hover {
      transform: scale(1.04);
      background: rgba(180, 205, 160, 1);
    }

    /* Capibara */
    .capibara {
      position: absolute;
      bottom: 0;
      right: -15px;
      z-index: 1;
    }

    .capibara img {
      width: 220px;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 25px;
      left: 25px;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 500;
      z-index: 2;
    }

    /* Desktop */
    @media (min-width: 768px) {

      .logo img {
        width: 190px;
      }

      h1 {
        font-size: 34px;
      }

      .link-btn {
        width: 320px;
        font-size: 18px;
      }

      .capibara img {
        width: 380px;
      }
    }

  </style>
</head>

<body>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="img/video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="page">

    <div class="logo">
      <img src="img/logo.png" alt="Logo Tourencol">
    </div>

    <h1>CONTÁCTANOS</h1>

    <div class="links">
      <a class="link-btn" href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">WhatsApp</a>
      <a class="link-btn" href="https://www.facebook.com/Tourencol" target="_blank">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">Instagram</a>
      <a class="link-btn" href="https://www.tiktok.com/@tourencol" target="_blank">TikTok</a>
      <a class="link-btn" href="#" onclick="return false;">Portafolio</a>
    </div>

    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara">
    </div>

    <div class="footer">
      <strong>TOURENCOL</strong><br>
      EMAIL<br>
      reservas@tourencol.com.co
    </div>

  </div>

</body>
</html>
