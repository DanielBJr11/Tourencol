<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tipografía Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      color: #ffffff;
    }

    /* Video de fondo */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Capa oscura sobre el video */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo {
      margin-top: 50px;
    }

    .logo img {
      width: 200px;
    }

    /* Título */
    h1 {
      margin-top: 15px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Links / banners */
    .links {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: -60px; /* Desktop */
    }

    .link-btn {
      width: 260px;
      padding: 16px;
      text-align: center;
      background: rgba(34, 139, 34, 0.4); /* más transparente */
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s ease, background 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .link-btn:hover {
      transform: scale(1.05);
      background: rgba(34, 139, 34, 0.6);
    }

    /* Capibara decorativo */
    .capibara {
      position: absolute;
      bottom: -20px;
      right: -60px;
      z-index: 2;
    }

    .capibara img {
      width: 500px;
      pointer-events: none;
      opacity: 0.95;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 16px;
      line-height: 1.4;
      text-align: left;
      font-weight: 500;
    }

    /* Ajustes específicos para móvil */
    @media (max-width: 480px) {
      /* Agrandar logos */
      .logo img {
        width: 170px;
      }

      h1 {
        font-size: 28px; /* un poco más grande */
        margin-top: 5px; /* menos espacio sobre banners */
      }

      /* Links / banners */
      .links {
        margin-top: 0px; /* acercar banners al título */
        gap: 8px; /* menos espacio entre banners */
      }

      .link-btn {
        width: 200px;
        padding: 14px;
        font-size: 15px; /* un poco más grande */
        background: rgba(34, 139, 34, 0.3); /* más transparente */
      }

      /* Capibara */
      .capibara img {
        width: 180px; /* tamaño adecuado */
      }

      .capibara {
        bottom: -5px; /* subir capibara un poco */
        right: -20px;
      }

      /* Footer */
      .footer {
        font-size: 15px; /* un poco más grande */
        bottom: 30px; /* subir footer un poco */
      }
    }
  </style>
</head>

<body>

  <!-- Video de fondo -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="img/video.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <div class="overlay"></div>

  <div class="page">

    <!-- Logo -->
    <div class="logo">
      <img src="img/logo.png" alt="Logo Tourencol">
    </div>

    <!-- Título -->
    <h1>CONTÁCTANOS</h1>

    <!-- Links / banners -->
    <div class="links">
      <a class="link-btn" href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">WhatsApp</a>
      <a class="link-btn" href="https://www.facebook.com/Tourencol" target="_blank">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">Instagram</a>
      <a class="link-btn" href="https://www.tiktok.com/@tourencol?_r=1&_t=ZS-93SFjsYbSq7" target="_blank">TikTok</a>
      <a class="link-btn" href="#" onclick="return false;">Portafolio (próximamente)</a>
    </div>

    <!-- Capibara decorativo -->
    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara decorativo">
    </div>

    <!-- Footer -->
    <div class="footer">
      <strong>TOURENCOL</strong><br>
      EMAIL<br>
      reservas@tourencol.com.co
    </div>

  </div>

</body>
</html>
