<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      color: #ffffff;
    }

    /* Video de fondo */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Capa oscura sobre el video */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 120px;
    }

    /* Título */
    h1 {
      margin-top: 15px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    /* Links */
    .links {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .link-btn {
      width: 260px;
      padding: 14px;
      text-align: center;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .link-btn:hover {
      background: #eaeaea;
      transform: scale(1.03);
    }

    /* Capibara */
    .capibara {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }

    .capibara img {
      width: 120px;
      opacity: 0.9;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .logo img {
        width: 100px;
      }

      .capibara img {
        width: 90px;
      }
    }
  </style>
</head>

<body>

  <!-- Video de fondo -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="img/video.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <!-- Capa oscura sobre el video -->
  <div class="overlay"></div>

  <div class="page">

    <!-- Logo -->
    <div class="logo">
      <img src="img/logo.png" alt="Logo empresa">
    </div>

    <!-- Título -->
    <h1>CONTÁCTANOS</h1>

    <!-- Links -->
    <div class="links">
      <a class="link-btn" href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">
        WhatsApp
      </a>

      <a class="link-btn" href="https://www.facebook.com/Tourencol" target="_blank">
        Facebook
      </a>

      <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">
        Instagram
      </a>

      <a class="link-btn" href="https://www.tiktok.com/@tourencol?_r=1&_t=ZS-93SFjsYbSq7" target="_blank">
        TikTok
      </a>

      <a class="link-btn" href="#" onclick="return false;">
        Portafolio (próximamente)
      </a>
    </div>

    <!-- Capibara decorativo -->
    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara decorativo">
    </div>

    <!-- Footer actualizado -->
    <div class="footer">
      <strong>TOURENCOL</strong><br>
      reservas@tourencol.com.co
    </div>

  </div>

</body>
</html>
