<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: url("img/fondo.jpg") no-repeat center center/cover;
      position: relative;
      color: #fff;
    }

    /* Capa para suavizar el fondo */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo {
      margin-top: 30px;
    }

    .logo img {
      width: 120px;
    }

    /* Título */
    h1 {
      margin-top: 15px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    /* Botones */
    .links {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .link-btn {
      width: 260px;
      padding: 14px;
      text-align: center;
      background: #ffffff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }

    .link-btn:hover {
      background: #eaeaea;
      transform: scale(1.03);
    }

    /* Capibara */
    .capibara {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }

    .capibara img {
      width: 120px;
      opacity: 0.9;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .capibara img {
        width: 90px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Logo -->
    <div class="logo">
      <img src="img/logo.png" alt="Logo empresa">
    </div>

    <!-- Título -->
    <h1>CONTÁCTANOS</h1>

    <!-- Links -->
    <div class="links">
      <a class="link-btn" href="https://wa.me/573001234567" target="_blank">WhatsApp</a>
      <a class="link-btn" href="#" target="_blank">Facebook</a>
      <a class="link-btn" href="#" target="_blank">Instagram</a>
      <a class="link-btn" href="#" target="_blank">TikTok</a>
      <a class="link-btn" href="#" target="_blank">Portafolio</a>
    </div>

    <!-- Capibara -->
    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara decorativo">
    </div>

    <!-- Footer -->
    <div class="footer">
      <strong>Nombre de la empresa</strong><br>
      contacto@empresa.com
    </div>

  </div>

</body>
</html>
