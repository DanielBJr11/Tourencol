<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourencol | Contáctanos</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #000; /* respaldo si el video no carga */
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

/* Video de fondo */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* Oscurecer para legibilidad */
.overlay {
  min-height: 100vh;
  background: rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 160px;
  text-align: center;
}

/* Logo */
.logo {
  width: 120px;
  margin-bottom: 10px;
}

/* Título */
h1 {
  margin: 15px 0 25px;
  letter-spacing: 2px;
}

/* Botones */
.botones {
  width: 100%;
  max-width: 360px;
}

.botones a {
  display: block;
  background: #c6d3af;
  color: #1f2d16;
  text-decoration: none;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 40px;
  font-weight: bold;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 45px;
  text-align: center;
  font-size: 14px;
}

/* Capibara */
.capibara {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 150px;
  opacity: 0.85;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- Video de fondo -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="img/video.mp4" type="video/mp4">
</video>

<div class="overlay">

  <img src="img/logo.png" class="logo" alt="Tourencol">

  <h1>CONTÁCTANOS</h1>

  <div class="botones">
    <a href="#">WhatsApp</a>
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
    <a href="#">TikTok</a>
    <a href="#">Portafolio</a>
  </div>

</div>

<div class="footer">
  <strong>TOURENCOL</strong><br>
  EMAIL<br>
  reservas@tourencol.com.co
</div>

<img src="img/capibara.png" class="capibara" alt="Capibara">

</body>
</html>
