<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  color: #fff;
  overflow: hidden;
}

/* Fondo */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -3;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: -2;
}

/* Página */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 30px;
  position: relative;
}

/* Logo */
.logo img {
  width: 150px;
  margin-bottom: 6px;
}

/* Título */
h1 {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

/* Botones */
.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: -5px; /* 🔥 subir bloque */
  z-index: 5;       /* 🔥 sobre capibara */
}

.link-btn {
  width: 255px; /* 🔥 más compacto */
  padding: 15px;
  border-radius: 40px;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: 600;
  color: #1f1f1f;
  background: rgba(190, 215, 175, 0.75); /* 🔥 más tipo Canva */
  backdrop-filter: blur(4px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, background 0.2s ease;
}

.link-btn:hover {
  transform: scale(1.03);
  background: rgba(190, 215, 175, 0.9);
}

/* Capibara */
.capibara {
  position: absolute;
  bottom: -8px;
  right: -20px;
  z-index: 1; /* 🔥 detrás de botones */
  opacity: 0.95;
}

.capibara img {
  width: 210px;
  pointer-events: none;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 25px;
  left: 25px;
  font-size: 15px;
  line-height: 1.4;
  font-weight: 500;
  z-index: 4;
}

/* Desktop */
@media (min-width: 768px) {

  .logo img {
    width: 190px;
  }

  h1 {
    font-size: 34px;
  }

  .links {
    gap: 12px;
  }

  .link-btn {
    width: 320px;
    font-size: 18px;
  }

  .capibara img {
    width: 380px;
  }
}
</style>
