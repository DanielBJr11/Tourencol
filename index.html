<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contáctanos | Tourencol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      overflow: hidden;
    }

    /* Video fondo */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    /* Overlay profesional (degradado) */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.25),
        rgba(0,0,0,0.45)
      );
      z-index: -2;
    }

    /* Contenedor */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 40px;
      position: relative;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo */
    .logo img {
      width: 160px;
      margin-bottom: 10px;
    }

    /* Título */
    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Botones */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }

    .link-btn {
      width: 260px;
      padding: 15px;
      border-radius: 40px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: #1e2a1e;
      background: rgba(198, 215, 185, 0.8);
      border: 1px solid rgba(255,255,255,0.35);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: rgba(198, 215, 185, 0.95);
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    /* Capibara */
    .capibara {
      position: absolute;
      bottom: -8px;
      right: -20px;
      z-index: 2;
      opacity: 0.95;
    }

    .capibara img {
      width: 220px;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 25px;
      left: 25px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 500;
      opacity: 0.95;
    }

    /* Desktop */
    @media (min-width: 768px) {

      .logo img {
        width: 200px;
      }

      h1 {
        font-size: 36px;
      }

      .link-btn {
        width: 320px;
        font-size: 18px;
      }

      .capibara img {
        width: 380px;
      }
    }
  </style>
</head>

<body>

  <!-- Video fondo -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="img/video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="page">

    <!-- Logo -->
    <div class="logo">
      <img src="img/logo.png" alt="Logo Tourencol">
    </div>

    <!-- Título -->
    <h1>CONTÁCTANOS</h1>

    <!-- Botones -->
    <div class="links">
      <a class="link-btn" href="https://wa.me/message/NWTKUGQ4OCITF1" target="_blank">WhatsApp</a>
      <a class="link-btn" href="https://www.facebook.com/Tourencol" target="_blank">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/tourencol/" target="_blank">Instagram</a>
      <a class="link-btn" href="https://www.tiktok.com/@tourencol" target="_blank">TikTok</a>
      <a class="link-btn" href="#" onclick="return false;">Portafolio</a>
    </div>

    <!-- Capibara -->
    <div class="capibara">
      <img src="img/capibara.png" alt="Capibara decorativo">
    </div>

    <!-- Footer -->
    <div class="footer">
      <strong>TOURENCOL</strong><br>
      EMAIL<br>
      reservas@tourencol.com.co
    </div>

  </div>

</body>
</html>
